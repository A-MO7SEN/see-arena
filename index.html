<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SEE · Match Arena 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef3f9; --dim:#8fa3ba; --panel:rgba(10,16,26,.82); --line:rgba(140,170,205,.18);
    --amber:#f5a83b; --blue:#3f8fdd; --red:#e24b4a; --teal:#37c69a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#070b12;font-family:'Barlow',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  button,select,input{touch-action:manipulation}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .hud *{pointer-events:auto}
  #topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;gap:12px}
  .badge{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;backdrop-filter:blur(6px)}
  .badge h1{font-family:'Barlow Condensed';font-size:20px;font-weight:700;letter-spacing:.06em;line-height:1}
  .badge p{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.08em}
  .cams{display:flex;gap:6px}
  .cams button{font-family:'Barlow Condensed';font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(6px)}
  .cams button.on{color:var(--ink);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
  #lowerthird{left:18px;bottom:86px;display:flex;gap:8px;flex-wrap:wrap;max-width:min(92vw,560px)}
  .stat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--blue));border-radius:4px;
    padding:6px 12px;min-width:104px;backdrop-filter:blur(6px)}
  .stat .n{font-family:'Barlow Condensed';font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--dim)}
  .stat .v{font-family:'Barlow Condensed';font-size:21px;font-weight:700;line-height:1.1}
  .stat .v small{font-size:12px;color:var(--dim);font-weight:600;margin-left:2px}
  #controls{left:0;right:0;bottom:0;padding:12px 18px 16px;display:flex;align-items:center;gap:12px;
    background:linear-gradient(transparent,rgba(5,8,14,.92) 40%)}
  #play{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:15px;cursor:pointer;flex:none;backdrop-filter:blur(6px)}
  #play:hover{border-color:var(--blue)}
  #clock{font-family:'Barlow Condensed';font-size:17px;font-weight:600;letter-spacing:.05em;min-width:52px;text-align:center;color:var(--amber)}
  #seek{flex:1;appearance:none;height:4px;border-radius:2px;background:rgba(140,170,205,.25);outline:none;cursor:pointer}
  #seek::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid #070b12}
  #seek::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #070b12}
  select,.tgl{font-family:'Barlow',sans-serif;font-size:12px;font-weight:500;color:var(--dim);background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;backdrop-filter:blur(6px)}
  .tgl.on{color:var(--ink);border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
  @media (max-width:700px), (pointer:coarse) and (max-height:520px){
    #topbar{padding:10px 12px}
    .badge{padding:6px 10px}
    .badge h1{font-size:15px}
    .badge p{font-size:9px}
    .cams button{padding:9px 10px;font-size:12px}
    #lowerthird{left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));max-width:none;
      flex-wrap:nowrap;overflow-x:auto;padding:0 12px 4px;gap:6px;scrollbar-width:none}
    #lowerthird::-webkit-scrollbar{display:none}
    .stat{min-width:96px;padding:5px 10px;flex:none}
    .stat .v{font-size:18px}
    #controls{padding:8px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;flex-wrap:wrap}
    #play{width:44px;height:44px}
    #seek{flex-basis:100%;order:5;height:6px}
    #seek::-webkit-slider-thumb{width:20px;height:20px}
    select,.tgl{padding:9px 10px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud" id="topbar">
  <div class="badge"><h1>SEE MATCH ARENA</h1><p>PADEL · 3D REPLAY &amp; HEAT ANALYSIS</p></div>
  <div class="cams">
    <button data-cam="broadcast" class="on">BROADCAST</button>
    <button data-cam="corner">CORNER</button>
    <button data-cam="tactical">TACTICAL</button>
  </div>
</div>

<div class="hud" id="lowerthird"></div>

<div class="hud" id="controls">
  <button id="play" title="Play / pause">❚❚</button>
  <div id="clock">0:00</div>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  <button class="tgl on" id="tglHeat">Heatmap</button>
  <button class="tgl on" id="tglTrails">Trails</button>
  <button class="tgl on" id="tglBall">Ball</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   MATCH DATA — replace with your real export.
   Court coordinates: x ∈ [-5, 5] (width, metres), z ∈ [-10, 10] (length).
   HEATMAP accepts EITHER:
     { grid: number[rows][cols] }          rows run along z (−10→10), cols along x (−5→5)
     { points: [{x, z, w}] }               weighted visit points in court metres
   ================================================================ */
const HEATMAP = {
  points: [
    {x:-2.6,z:-7.2,w:1.0},{x:-2.2,z:-6.4,w:.8},{x:-3.1,z:-7.8,w:.7},{x:-1.4,z:-6.9,w:.6},
    {x: 2.5,z:-7.0,w:.9},{x: 2.9,z:-7.9,w:.7},{x: 1.8,z:-6.2,w:.6},{x: 3.4,z:-6.8,w:.5},
    {x:-2.4,z: 6.8,w:.9},{x:-1.8,z: 7.6,w:.7},{x:-3.0,z: 6.1,w:.6},
    {x: 2.6,z: 7.1,w:1.0},{x: 3.2,z: 6.3,w:.8},{x: 1.9,z: 7.9,w:.6},
    {x:-1.2,z:-2.4,w:.55},{x: 1.5,z:-2.8,w:.5},{x:-.8,z: 2.6,w:.5},{x: 1.1,z: 2.2,w:.45},
    {x: .2,z:-4.8,w:.4},{x:-.4,z: 4.5,w:.4},{x: 4.1,z:-4.5,w:.35},{x:-4.0,z: 4.2,w:.3}
  ],
  radius: 1.6   // metres of influence per point (ignored for grid input)
};
const PLAYERS = [
  {name:'A. HASSAN', tag:'P1', team:0, base:[-2.5,-7]},
  {name:'K. TANAKA', tag:'P2', team:0, base:[ 2.5,-7]},
  {name:'M. LOPEZ',  tag:'P3', team:1, base:[-2.5, 7]},
  {name:'J. SILVA',  tag:'P4', team:1, base:[ 2.5, 7]}
];
const TEAM_COLORS = [0xe8603c, 0x3f8fdd];
const RALLY_LEN = 42;                       // seconds, loops
/* ================================================================ */

const W=10, L=20, WALL=3, FENCE=4;
const MOBILE = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth,innerHeight) < 500;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:!MOBILE, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE?1.6:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b12);
scene.fog = new THREE.Fog(0x070b12, 55, 110);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 250);
function fitView(){
  camera.aspect = innerWidth/innerHeight;
  camera.fov = camera.aspect < 1 ? Math.min(70, 46 + (1-camera.aspect)*38) : 46;
  camera.updateProjectionMatrix();
}
fitView();

/* ---------- lighting: spotlit court in a dark bowl ---------- */
scene.add(new THREE.AmbientLight(0x28344a, .55));
const key = new THREE.SpotLight(0xfff4e0, 1.15, 90, .62, .45, 1.1);
key.position.set(14, 26, 10); key.castShadow = true;
key.shadow.mapSize.set(MOBILE?1024:2048, MOBILE?1024:2048); key.shadow.bias=-0.0004;
scene.add(key, key.target);
const fill = new THREE.SpotLight(0xbcd4ff, .5, 90, .7, .6, 1.2);
fill.position.set(-16, 22, -12); scene.add(fill, fill.target);
const rim = new THREE.DirectionalLight(0x35507e, .35); rim.position.set(0,10,-30); scene.add(rim);

/* light shafts from the rig */
const shaftMat = new THREE.MeshBasicMaterial({color:0x9db8e0, transparent:true, opacity:.045, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide});
const shafts=[];
[[14,26,10],[-16,22,-12],[15,24,-14],[-13,25,13]].slice(0, MOBILE?2:4).forEach(p=>{
  const cone = new THREE.Mesh(new THREE.ConeGeometry(6.5, 27, 24, 1, true), shaftMat);
  cone.position.set(p[0]*.55, p[1]*.5, p[2]*.55);
  cone.lookAt(0,0,0); cone.rotateX(-Math.PI/2); cone.translateY(-13);
  scene.add(cone); shafts.push(cone);
});

/* ---------- arena bowl: floor apron + crowd ---------- */
const apron = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({color:0x0d1420, roughness:.95}));
apron.rotation.x = -Math.PI/2; apron.position.y = -0.01; apron.receiveShadow = true; scene.add(apron);

const dot = document.createElement('canvas'); dot.width=dot.height=32;
const dctx = dot.getContext('2d');
const g = dctx.createRadialGradient(16,16,1,16,16,15);
g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
dctx.fillStyle=g; dctx.fillRect(0,0,32,32);
const dotTex = new THREE.CanvasTexture(dot);

const crowdPos=[], crowdCol=[];
const palette=[0x223148,0x2a3c58,0x314763,0x1d2a3e,0x3a2f3f,0x27404f];
for(let ring=0; ring<(MOBILE?10:16); ring++){
  const rx = 17 + ring*1.35, rz = 24 + ring*1.35, y = 2.2 + ring*.78;
  const n = Math.floor((rx+rz)*1.9);
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + (ring%2)*.04;
    crowdPos.push(Math.cos(a)*rx, y + (Math.random()-.5)*.3, Math.sin(a)*rz);
    const c = new THREE.Color(palette[(Math.random()*palette.length)|0]);
    crowdCol.push(c.r,c.g,c.b);
  }
}
const crowdGeo = new THREE.BufferGeometry();
crowdGeo.setAttribute('position', new THREE.Float32BufferAttribute(crowdPos,3));
crowdGeo.setAttribute('color', new THREE.Float32BufferAttribute(crowdCol,3));
scene.add(new THREE.Points(crowdGeo, new THREE.PointsMaterial({size:.5, map:dotTex, vertexColors:true, transparent:true, depthWrite:false, sizeAttenuation:true})));

/* camera flashes in the crowd */
const flashMat = new THREE.SpriteMaterial({map:dotTex, color:0xffffff, transparent:true, opacity:0});
const flashes = [];
for(let i=0;i<5;i++){ const s=new THREE.Sprite(flashMat.clone()); s.scale.set(1.4,1.4,1); scene.add(s); flashes.push({s, t:Math.random()*3}); }

/* ---------- court ---------- */
const court = new THREE.Group(); scene.add(court);

const turf = new THREE.Mesh(new THREE.PlaneGeometry(W, L), new THREE.MeshStandardMaterial({color:0x155a9e, roughness:.88}));
turf.rotation.x=-Math.PI/2; turf.receiveShadow=true; court.add(turf);
const surround = new THREE.Mesh(new THREE.PlaneGeometry(W+4, L+4), new THREE.MeshStandardMaterial({color:0x0f2f52, roughness:.92}));
surround.rotation.x=-Math.PI/2; surround.position.y=-0.005; surround.receiveShadow=true; court.add(surround);

function lineMesh(w,l,x,z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,l), new THREE.MeshBasicMaterial({color:0xeef6ff}));
  m.rotation.x=-Math.PI/2; m.position.set(x,.012,z); court.add(m);
}
lineMesh(.06,L,-W/2+.03,0); lineMesh(.06,L,W/2-.03,0);
lineMesh(W,.06,0,-L/2+.03); lineMesh(W,.06,0,L/2-.03);
lineMesh(W,.06,0,-6.95); lineMesh(W,.06,0,6.95);           // service lines
lineMesh(.06,6.95,0,-3.475);                               // centre service line, near half
lineMesh(.06,6.95,0, 3.475);                               // centre service line, far half

/* heatmap overlay */
function buildHeatTexture(){
  const cw=256, ch=512, accum=document.createElement('canvas');
  accum.width=cw; accum.height=ch;
  const a=accum.getContext('2d');
  a.fillStyle='#000'; a.fillRect(0,0,cw,ch);
  a.globalCompositeOperation='lighter';
  let pts = HEATMAP.points;
  if(HEATMAP.grid){
    pts=[]; const rows=HEATMAP.grid.length, cols=HEATMAP.grid[0].length;
    let mx=0; HEATMAP.grid.forEach(r=>r.forEach(v=>mx=Math.max(mx,v)));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const v=HEATMAP.grid[r][c]/(mx||1); if(v>.02)
      pts.push({x:-W/2+(c+.5)/cols*W, z:-L/2+(r+.5)/rows*L, w:v, rad:(L/rows)});
    }
  }
  pts.forEach(p=>{
    const px=(p.x+W/2)/W*cw, pz=(p.z+L/2)/L*ch;
    const rad=((p.rad||HEATMAP.radius)/W)*cw;
    const gr=a.createRadialGradient(px,pz,1,px,pz,rad);
    gr.addColorStop(0,`rgba(255,255,255,${.55*p.w})`); gr.addColorStop(1,'rgba(255,255,255,0)');
    a.fillStyle=gr; a.beginPath(); a.arc(px,pz,rad,0,7); a.fill();
  });
  const img=a.getImageData(0,0,cw,ch), d=img.data;
  const out=document.createElement('canvas'); out.width=cw; out.height=ch;
  const o=out.getContext('2d'), oi=o.createImageData(cw,ch), od=oi.data;
  const stops=[[0,[0,0,0,0]],[.22,[31,90,165,80]],[.45,[46,178,138,130]],[.7,[245,168,59,185]],[1,[226,75,74,235]]];
  for(let i=0;i<d.length;i+=4){
    const v=Math.min(1,d[i]/255*1.35);
    let s0=stops[0],s1=stops[stops.length-1];
    for(let s=0;s<stops.length-1;s++) if(v>=stops[s][0]&&v<=stops[s+1][0]){s0=stops[s];s1=stops[s+1];break;}
    const f=(v-s0[0])/((s1[0]-s0[0])||1);
    for(let k=0;k<4;k++) od[i+k]=s0[1][k]+(s1[1][k]-s0[1][k])*f;
  }
  o.putImageData(oi,0,0);
  return new THREE.CanvasTexture(out);
}
const heat = new THREE.Mesh(new THREE.PlaneGeometry(W,L),
  new THREE.MeshBasicMaterial({map:buildHeatTexture(), transparent:true, opacity:.85, depthWrite:false}));
heat.rotation.x=-Math.PI/2; heat.position.y=.02; court.add(heat);

/* glass walls + fence + posts */
const glassMat = new THREE.MeshPhongMaterial({color:0x9cc4ec, transparent:true, opacity:.13, shininess:120, side:THREE.DoubleSide, depthWrite:false});
const frameMat = new THREE.MeshStandardMaterial({color:0x1a2536, roughness:.4, metalness:.6});
function glassPanel(w,h,x,y,z,ry){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat);
  p.position.set(x,y,z); p.rotation.y=ry; court.add(p);
}
function post(x,z,h){
  const p=new THREE.Mesh(new THREE.BoxGeometry(.09,h,.09),frameMat);
  p.position.set(x,h/2,z); p.castShadow=true; court.add(p);
}
glassPanel(W,WALL,0,WALL/2,-L/2,0); glassPanel(W,WALL,0,WALL/2,L/2,0);
for(const s of [-1,1]){                                    // side glass near backs (4 m each end)
  glassPanel(4,WALL,s*W/2, WALL/2, -L/2+2, Math.PI/2);
  glassPanel(4,WALL,s*W/2, WALL/2,  L/2-2, Math.PI/2);
}
for(let x=-W/2; x<=W/2+.01; x+=2.5){ post(x,-L/2,FENCE); post(x,L/2,FENCE); }
for(let z=-L/2; z<=L/2+.01; z+=2){ post(-W/2,z,z>-L/2+4-.1&&z<L/2-4+.1?FENCE:FENCE); post(W/2,z,FENCE); }

const fenceTex=(()=>{ const c=document.createElement('canvas'); c.width=c.height=64;
  const x=c.getContext('2d'); x.strokeStyle='rgba(210,225,245,.5)'; x.lineWidth=2;
  for(let i=-64;i<128;i+=16){ x.beginPath();x.moveTo(i,0);x.lineTo(i+64,64);x.stroke();
    x.beginPath();x.moveTo(i+64,0);x.lineTo(i,64);x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; })();
function fence(w,h,x,y,z,ry){
  const t=fenceTex.clone(); t.needsUpdate=true; t.repeat.set(w*1.4,h*1.4);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false}));
  m.position.set(x,y,z); m.rotation.y=ry; court.add(m);
}
fence(W,1,0,WALL+.5,-L/2,0); fence(W,1,0,WALL+.5,L/2,0);                       // mesh above back glass
for(const s of [-1,1]){
  fence(12,FENCE,s*W/2,FENCE/2,0,Math.PI/2);                                    // middle side sections full mesh
  fence(4,1,s*W/2,WALL+.5,-L/2+2,Math.PI/2); fence(4,1,s*W/2,WALL+.5,L/2-2,Math.PI/2);
}

/* net */
const netTex=fenceTex.clone(); netTex.needsUpdate=true; netTex.repeat.set(16,2);
const net=new THREE.Mesh(new THREE.PlaneGeometry(W,.88),
  new THREE.MeshBasicMaterial({map:netTex,transparent:true,opacity:.75,side:THREE.DoubleSide}));
net.position.y=.44; court.add(net);
const netBand=new THREE.Mesh(new THREE.BoxGeometry(W,.06,.03),new THREE.MeshBasicMaterial({color:0xeef6ff}));
netBand.position.y=.9; court.add(netBand);
post(-W/2-.05,0,1.05); post(W/2+.05,0,1.05);

/* ---------- LED perimeter boards ---------- */
function ledTexture(text){
  const c=document.createElement('canvas'); c.width=1024; c.height=64;
  const x=c.getContext('2d');
  x.fillStyle='#140f06'; x.fillRect(0,0,1024,64);
  x.font='700 40px Barlow Condensed, sans-serif'; x.fillStyle='#f5a83b';
  x.textBaseline='middle';
  let px=20; while(px<1100){ x.fillText(text,px,34); px+=x.measureText(text).width+70; }
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; return t;
}
const ledTexA=ledTexture('SEE ANALYTICS'), ledTexB=ledTexture('MATCH ARENA · LIVE');
const ledMats=[];
function ledBoard(w,x,z,ry,tex){
  const t=tex.clone(); t.needsUpdate=true; t.repeat.set(w/8,1);
  const mat=new THREE.MeshBasicMaterial({map:t}); ledMats.push(mat);
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,.8,.12),mat);
  b.position.set(x,.4,z); b.rotation.y=ry; scene.add(b);
}
ledBoard(W+6,0,-L/2-2.2,0,ledTexA); ledBoard(W+6,0,L/2+2.2,Math.PI,ledTexB);
ledBoard(L+6,-W/2-2.2,0,Math.PI/2,ledTexB); ledBoard(L+6,W/2+2.2,0,-Math.PI/2,ledTexA);

/* ---------- scoreboard cube ---------- */
const sbCanvas=document.createElement('canvas'); sbCanvas.width=512; sbCanvas.height=256;
const sb=sbCanvas.getContext('2d');
const sbTex=new THREE.CanvasTexture(sbCanvas);
function drawScoreboard(t){
  sb.fillStyle='#0a0e16'; sb.fillRect(0,0,512,256);
  sb.strokeStyle='#26344c'; sb.lineWidth=6; sb.strokeRect(6,6,500,244);
  sb.textAlign='center';
  sb.font='600 34px Barlow Condensed'; sb.fillStyle='#8fa3ba'; sb.fillText('SET 2',256,52);
  sb.font='700 96px Barlow Condensed'; sb.fillStyle='#eef3f9'; sb.fillText('4 – 3',256,150);
  sb.font='600 40px Barlow Condensed'; sb.fillStyle='#f5a83b';
  const m=Math.floor(t/60), s=Math.floor(t%60);
  sb.fillText(m+':'+String(s).padStart(2,'0'),256,215);
  sbTex.needsUpdate=true;
}
const cube=new THREE.Group();
for(let i=0;i<4;i++){
  const f=new THREE.Mesh(new THREE.PlaneGeometry(4,2),new THREE.MeshBasicMaterial({map:sbTex}));
  f.rotation.y=i*Math.PI/2; f.position.set(Math.sin(i*Math.PI/2)*1.2,0,Math.cos(i*Math.PI/2)*1.2);
  cube.add(f);
}
const cubeShell=new THREE.Mesh(new THREE.BoxGeometry(2.5,2.2,2.5),new THREE.MeshStandardMaterial({color:0x0d1420,roughness:.5}));
cube.add(cubeShell); cube.position.set(0,11.5,0);
const cable=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,8),frameMat);
cable.position.set(0,16.5,0);
const overhead=new THREE.Group(); overhead.add(cube,cable); scene.add(overhead);

/* ---------- mannequin players ---------- */
function limb(r,len,color){
  const grp=new THREE.Group();
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.85,len,10),new THREE.MeshStandardMaterial({color,roughness:.6}));
  cyl.position.y=-len/2; cyl.castShadow=true;
  const cap=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),cyl.material);
  cap.position.y=-len; grp.add(cyl,cap); return grp;
}
function makeMannequin(color){
  const c2=new THREE.Color(color).multiplyScalar(.72).getHex();
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color,roughness:.55});
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.16,.13,.52,12),bodyMat);
  torso.position.y=1.12; torso.castShadow=true;
  const chest=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),bodyMat); chest.position.y=1.38;
  const hip=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),bodyMat); hip.position.y=.86;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.115,14,12),new THREE.MeshStandardMaterial({color:0xd9c2ae,roughness:.6}));
  head.position.y=1.62; head.castShadow=true;
  g.add(torso,chest,hip,head);
  const lArm=limb(.05,.52,c2); lArm.position.set(-.21,1.36,0);
  const rArm=limb(.05,.5,c2);  rArm.position.set(.21,1.36,0);
  const racket=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.2),new THREE.MeshStandardMaterial({color:0x222831}));
  shaft.position.y=-.6;
  const headR=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.03,16),new THREE.MeshStandardMaterial({color:0x10151f,roughness:.4}));
  headR.rotation.x=Math.PI/2; headR.position.y=-.78;
  racket.add(shaft,headR); rArm.add(racket);
  const lLeg=limb(.06,.6,c2); lLeg.position.set(-.1,.82,0);
  const rLeg=limb(.06,.6,c2); rLeg.position.set(.1,.82,0);
  g.add(lArm,rArm,lLeg,rLeg);
  return {g, lArm, rArm, lLeg, rLeg};
}

/* ---------- choreography (generated from shot schedule) ---------- */
const shots=[]; const order=[0,2,1,3];
for(let t=1.2,k=0; t<RALLY_LEN-1.5; t+=1.7,k++) shots.push({t, p:order[k%4]});
const seed=s=>()=>((s=(s*9301+49297)%233280)/233280);
const rnd=seed(7);
const tracks=PLAYERS.map((pl,i)=>{
  const kf=[{t:0,x:pl.base[0],z:pl.base[1]}];
  shots.filter(s=>s.p===i).forEach(s=>{
    const zs=Math.sign(pl.base[1]);
    const x=Math.max(-4.3,Math.min(4.3,pl.base[0]+(rnd()*5-2.5)));
    const z=zs*(2.6+rnd()*6.4);
    kf.push({t:s.t-.55,x,z},{t:s.t+.15,x,z});
    kf.push({t:s.t+1.25,x:(x+pl.base[0])/2,z:(z+pl.base[1]*.9)/1.9*2/2+zs*1});
  });
  kf.push({t:RALLY_LEN,x:pl.base[0],z:pl.base[1]});
  kf.sort((a,b)=>a.t-b.t);
  return kf;
});
function samplePos(kf,t){
  if(t<=kf[0].t) return kf[0];
  for(let i=0;i<kf.length-1;i++){
    if(t>=kf[i].t&&t<=kf[i+1].t){
      let f=(t-kf[i].t)/((kf[i+1].t-kf[i].t)||1); f=f*f*(3-2*f);
      return {x:kf[i].x+(kf[i+1].x-kf[i].x)*f, z:kf[i].z+(kf[i+1].z-kf[i].z)*f};
    }
  } return kf[kf.length-1];
}
/* distance lookup */
const distCum=tracks.map(kf=>{
  const arr=[0]; let prev=samplePos(kf,0);
  for(let t=.1;t<=RALLY_LEN+.001;t+=.1){
    const p=samplePos(kf,t);
    arr.push(arr[arr.length-1]+Math.hypot(p.x-prev.x,p.z-prev.z)); prev=p;
  } return arr;
});

const rigs=PLAYERS.map((pl,i)=>{
  const m=makeMannequin(TEAM_COLORS[pl.team]);
  m.g.position.set(pl.base[0],0,pl.base[1]); scene.add(m.g);
  const trailGeo=new THREE.BufferGeometry();
  const trailN=90, trailArr=new Float32Array(trailN*3);
  trailGeo.setAttribute('position',new THREE.BufferAttribute(trailArr,3));
  const trail=new THREE.Line(trailGeo,new THREE.LineBasicMaterial({color:TEAM_COLORS[pl.team],transparent:true,opacity:.55}));
  scene.add(trail);
  return {...m, pl, trail, trailArr, trailN, trailI:0, trailFull:false, phase:rnd()*6, prev:{x:pl.base[0],z:pl.base[1]}};
});

/* ball */
const ball=new THREE.Mesh(new THREE.SphereGeometry(.075,14,12),new THREE.MeshStandardMaterial({color:0xd8f24b,roughness:.35}));
ball.castShadow=true; scene.add(ball);
const ballTrailN=26, ballArr=new Float32Array(ballTrailN*3);
const ballTrailGeo=new THREE.BufferGeometry();
ballTrailGeo.setAttribute('position',new THREE.BufferAttribute(ballArr,3));
const ballTrail=new THREE.Line(ballTrailGeo,new THREE.LineBasicMaterial({color:0xd8f24b,transparent:true,opacity:.5}));
scene.add(ballTrail); let ballTI=0;

function ballPos(t){
  let a=shots[0], b=shots[1];
  if(t<shots[0].t){ a={t:0,p:shots[0].p}; b=shots[0]; }
  else{
    a=null;
    for(let i=0;i<shots.length-1;i++) if(t>=shots[i].t&&t<shots[i+1].t){a=shots[i];b=shots[i+1];break;}
    if(!a){ a=shots[shots.length-1]; b={t:RALLY_LEN,p:shots[0].p}; }
  }
  const pa=samplePos(tracks[a.p],a.t), pb=samplePos(tracks[b.p],b.t);
  const f=Math.max(0,Math.min(1,(t-a.t)/((b.t-a.t)||1)));
  const y=.6+Math.sin(f*Math.PI)*(1.5+((a.t*13)%1)*0.9);
  return {x:pa.x+(pb.x-pa.x)*f, y, z:pa.z+(pb.z-pa.z)*f};
}

/* ---------- lower-third stats ---------- */
const lt=document.getElementById('lowerthird');
PLAYERS.forEach((p,i)=>{
  const d=document.createElement('div'); d.className='stat';
  d.style.setProperty('--c','#'+TEAM_COLORS[p.team].toString(16).padStart(6,'0'));
  d.innerHTML=`<div class="n">${p.tag} · ${p.name}</div><div class="v"><span id="d${i}">0</span><small>m</small></div>`;
  lt.appendChild(d);
});

/* ---------- camera ---------- */
let theta=Math.PI, phi=1.08, radius=25;
const target=new THREE.Vector3(0,1.2,0);
const presets={broadcast:{t:Math.PI,p:1.08,r:25}, corner:{t:Math.PI*.72,p:1.02,r:21}, tactical:{t:Math.PI,p:.28,r:27}};
let camAnim=null;
function setCam(name){
  const p=presets[name];
  camAnim={from:{t:theta,p:phi,r:radius},to:{t:p.t,p:p.p,r:p.r},f:0};
  document.querySelectorAll('.cams button').forEach(b=>b.classList.toggle('on',b.dataset.cam===name));
}
document.querySelectorAll('.cams button').forEach(b=>b.onclick=()=>setCam(b.dataset.cam));
function applyCam(){
  camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta), target.y+radius*Math.cos(phi), target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
const el=renderer.domElement;
let drag=false,lx=0,ly=0,pinch=0;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;camAnim=null;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag)return;
  theta-=(e.clientX-lx)*.005; phi=Math.max(.18,Math.min(1.42,phi-(e.clientY-ly)*.004));
  lx=e.clientX; ly=e.clientY;
});
el.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(9,Math.min(55,radius+e.deltaY*.02));camAnim=null;},{passive:false});
el.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    drag=false;
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch) radius=Math.max(9,Math.min(55,radius-(d-pinch)*.05));
    pinch=d; camAnim=null; e.preventDefault();
  }
},{passive:false});
el.addEventListener('touchend',()=>pinch=0);

/* ---------- timeline / UI ---------- */
let playing=true, simT=0, speed=1;
const playBtn=document.getElementById('play'), seek=document.getElementById('seek'), clockEl=document.getElementById('clock');
playBtn.onclick=()=>{playing=!playing; playBtn.textContent=playing?'❚❚':'▶';};
seek.oninput=()=>{simT=seek.value/1000*RALLY_LEN;};
document.getElementById('speed').onchange=e=>speed=+e.target.value;
function bindTgl(id,fn){const b=document.getElementById(id);b.onclick=()=>{b.classList.toggle('on');fn(b.classList.contains('on'));};}
bindTgl('tglHeat',v=>heat.visible=v);
bindTgl('tglTrails',v=>{rigs.forEach(r=>r.trail.visible=v); ballTrail.visible=v;});
bindTgl('tglBall',v=>{ball.visible=v; ballTrail.visible=v&&document.getElementById('tglTrails').classList.contains('on');});

addEventListener('resize',()=>{
  fitView();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- main loop ---------- */
let last=performance.now(), sbLast=-1;
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing){ simT=(simT+dt*speed)%RALLY_LEN; seek.value=simT/RALLY_LEN*1000; }
  const m=Math.floor(simT/60), s=Math.floor(simT%60);
  clockEl.textContent=m+':'+String(s).padStart(2,'0');
  if(Math.floor(simT)!==sbLast){ drawScoreboard(simT); sbLast=Math.floor(simT); }

  ledMats.forEach((mm,i)=>{ mm.map.offset.x+=dt*(.06+i*.008); });
  cube.rotation.y+=dt*.25;

  flashes.forEach(f=>{
    f.t-=dt;
    if(f.t<=0){
      const i=(Math.random()*crowdPos.length/3|0)*3;
      f.s.position.set(crowdPos[i],crowdPos[i+1],crowdPos[i+2]);
      f.s.material.opacity=.9; f.t=.6+Math.random()*2.4;
    }
    f.s.material.opacity*=Math.pow(.001,dt);
  });

  rigs.forEach((r,i)=>{
    const p=samplePos(tracks[i],simT);
    const vx=(p.x-r.prev.x)/dt||0, vz=(p.z-r.prev.z)/dt||0;
    const sp=Math.hypot(vx,vz);
    r.g.position.set(p.x,0,p.z);
    if(sp>.4) r.g.rotation.y=Math.atan2(vx,vz);
    else r.g.rotation.y+= (Math.atan2(-Math.sign(PLAYERS[i].base[1]),0.0001)*0 + ((PLAYERS[i].team===0?0:Math.PI)-r.g.rotation.y))*.06;
    r.phase+=dt*(2+sp*4.2);
    const swing=Math.sin(r.phase)*Math.min(.8,sp*.35);
    r.lLeg.rotation.x=swing; r.rLeg.rotation.x=-swing;
    r.lArm.rotation.x=-swing*.7;
    /* shot swing animation */
    let sw=0;
    for(const sh of shots) if(sh.p===i){ const d2=simT-sh.t; if(d2>-.35&&d2<.45){ sw=d2<0? (d2+.35)/.35 : 1-(d2/.45); break; } }
    r.rArm.rotation.x=swing*.7*(1-sw)+(-2.2*sw);
    r.rArm.rotation.z=-.25-1.1*sw;
    r.g.position.y=Math.abs(Math.sin(r.phase))*Math.min(.05,sp*.02);
    r.prev=p;
    /* trail */
    r.trailArr[r.trailI*3]=p.x; r.trailArr[r.trailI*3+1]=.05; r.trailArr[r.trailI*3+2]=p.z;
    r.trailI=(r.trailI+1)%r.trailN; if(r.trailI===0)r.trailFull=true;
    r.trail.geometry.setDrawRange(0,r.trailFull?r.trailN:r.trailI);
    r.trail.geometry.attributes.position.needsUpdate=true;
    const di=Math.min(distCum[i].length-1,Math.floor(simT/.1));
    document.getElementById('d'+i).textContent=Math.round(distCum[i][di]);
  });

  const bp=ballPos(simT);
  ball.position.set(bp.x,bp.y,bp.z);
  ballArr[ballTI*3]=bp.x; ballArr[ballTI*3+1]=bp.y; ballArr[ballTI*3+2]=bp.z;
  ballTI=(ballTI+1)%ballTrailN;
  ballTrail.geometry.setDrawRange(0,ballTrailN);
  ballTrail.geometry.attributes.position.needsUpdate=true;

  if(camAnim){
    camAnim.f=Math.min(1,camAnim.f+dt*2.2);
    const f=camAnim.f*camAnim.f*(3-2*camAnim.f);
    theta=camAnim.from.t+(camAnim.to.t-camAnim.from.t)*f;
    phi=camAnim.from.p+(camAnim.to.p-camAnim.from.p)*f;
    radius=camAnim.from.r+(camAnim.to.r-camAnim.from.r)*f;
    if(camAnim.f>=1)camAnim=null;
  }
  const topdown = phi < 0.55;
  overhead.visible = !topdown;
  shafts.forEach(sh=>sh.visible=!topdown);
  applyCam();
  renderer.render(scene,camera);
}
drawScoreboard(0); applyCam(); requestAnimationFrame(tick);
</script>
</body>
</html>
